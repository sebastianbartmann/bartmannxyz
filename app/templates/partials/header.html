{#- Same markup as the header of thirdpartycheck.com (tpc/web/ui/templates/base.html). #}
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
    <div class="container">
        <div class="site-header__inner">
            <a href="/" class="brand-link">bartmann.xyz</a>
            <nav id="primary-navigation" class="site-header__nav" aria-label="Primary pages">
                <a href="/projects" class="nav-link{% if request.url.path.startswith('/projects') %} is-active" aria-current="page{% endif %}">Projects</a>
                <a href="/blog" class="nav-link{% if request.url.path.startswith('/blog') %} is-active" aria-current="page{% endif %}">Writing</a>
            </nav>
            <div class="site-header__actions">
                <button type="button" data-menu-toggle class="icon-button site-header__menu-toggle"
                        aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-navigation">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <button type="button" data-theme-toggle class="icon-button" aria-label="Toggle dark mode">
                    <svg class="icon theme-icon--sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg class="icon theme-icon--moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</header>
