<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}bartmann.xyz{% endblock %}</title>

    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <meta name="description" content="Sebastian Bartmann builds agent-facing internet tools and writes about the work."/>
    <link rel="stylesheet" href="/static/css/main.css?v={{ static_version }}">
    {#- consent-layer tracker and consent panel (served by the collector under /dl/).
        The privacy page overrides this block with nothing: it must load neither tag. #}
    {% block consent_layer %}
    <link rel="stylesheet" href="/dl/s.css">
    <script src="/dl/s.js" defer></script>
    {% endblock %}
</head>
<body>
{% block content %}{% endblock %}
<script src="/static/scripts/theme.js?v={{ static_version }}"></script>
</body>
</html>
