<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}bartmann.xyz{% endblock %}</title>

    <script src="/static/scripts/htmx.min.js?v={{ static_version }}"></script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="icon" href="/static/images/profile.webp"/>
    <meta name="description" content="Sebastian Bartmann builds agent-facing internet tools and writes about the work."/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/custom.css?v={{ static_version }}">
</head>
<body>
{% block content %}{% endblock %}
<script src="/static/scripts/theme.js?v={{ static_version }}"></script>
</body>
</html>
